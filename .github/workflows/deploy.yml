name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml', '.lighthouserc.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # AGENTS.md: Lighthouse mobile >= 85. Gate the deploy on it: the site is served
  # locally from ./site (no audio is ever fetched — nothing autoplays), mobile
  # emulation, 3 runs per URL, hard asserts below.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true

  deploy:
    needs: lighthouse
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
