name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml', '.lighthouserc.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # AGENTS.md: Lighthouse mobile >= 85. Gate the deploy on it: LHCI serves
  # ./site locally (staticDistDir — no audio is ever fetched, nothing autoplays),
  # mobile emulation + simulated throttling, 3 runs per URL, hard asserts in
  # .lighthouserc.json. Local check before wiring this: perf 95-99, a11y/seo/bp 100.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Lighthouse CI (mobile)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14

  deploy:
    needs: lighthouse
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
